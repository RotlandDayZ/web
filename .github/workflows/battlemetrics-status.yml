name: Aktualizacja statusu serwera (BattleMetrics)

on:
  schedule:
    # Co 15 minut. GitHub czasem opóźnia harmonogramy przy dużym obciążeniu platformy — to normalne.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: battlemetrics-status
  cancel-in-progress: true

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pobierz dane z BattleMetrics
        env:
          BM_SERVER_ID: "33543431"
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS -f \
            -H "Accept: application/json" \
            -H "User-Agent: RotlandStatusBot/1.0 (+https://rotlanddayz.github.io/web/)" \
            "https://api.battlemetrics.com/servers/${BM_SERVER_ID}") || {
              echo "Zapytanie do BattleMetrics nie powiodło się — zostawiam poprzedni plik status.json bez zmian."
              exit 0
            }

          echo "$RESPONSE" > /tmp/bm_response.json

          STATUS=$(jq -r '.data.attributes.status // "unknown"' /tmp/bm_response.json)
          PLAYERS=$(jq -r '.data.attributes.players // 0' /tmp/bm_response.json)
          MAX_PLAYERS=$(jq -r '.data.attributes.maxPlayers // 0' /tmp/bm_response.json)
          UPDATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          mkdir -p assets/data
          jq -n \
            --arg status "$STATUS" \
            --argjson players "$PLAYERS" \
            --argjson maxPlayers "$MAX_PLAYERS" \
            --arg updatedAt "$UPDATED_AT" \
            '{status: $status, players: $players, maxPlayers: $maxPlayers, updatedAt: $updatedAt}' \
            > assets/data/status.json

          cat assets/data/status.json

      - name: Commituj zmiany (jeśli są)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/data/status.json; then
            echo "Brak zmian w statusie — pomijam commit."
          else
            git add assets/data/status.json
            git commit -m "chore: aktualizacja statusu serwera [automat]"
            git push
          fi
